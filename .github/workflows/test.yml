name: Test

on:
  schedule:
    - cron: '0 13 1 * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: q215613905
            repoName: TVBoxOS
            branchName: main
            java_ver: '17'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Check New Commit
        run: |
          upStream=https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}
          echo "upStream=$upStream" >> $GITHUB_ENV
          commit=$(curl -sL $upStream/commits/${{ matrix.branchName }} |grep -o "/${{ matrix.userName }}/${{ matrix.repoName }}/commit/[a-z0-9]\+" |head -1 | cut -d\/ -f5)
          if [[ -z "${commit}" ]]; then
            commit=$(curl -s "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}?per_page=1" | jq -r '.sha' )
          fi
          if ! grep -q "$commit" README.md || [ "${{ inputs.rebuild }}" == "true" ]; then
            echo "commit=$commit" >> $GITHUB_ENV
            echo "commitS=${commit:0:7}" >> $GITHUB_ENV
          fi
          echo "commit=$commit"

      - name: Checkout Source Code
        if: ${{ env.commit }}
        run: |
          git clone ${{ env.upStream }} TVBoxOSC
          cd TVBoxOSC
          git checkout ${{ env.commit }}
          echo "tag=$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:%cd ${{ env.commitS }} -1)" >> $GITHUB_ENV

      - name: Extra Modify
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo '修改VersionName'
          if [ "${{ matrix.userName }}" == "takagen99" ]; then
            sed -i 's/\.concat(buildTime())/ +\"${{ env.tag }}\"/g' app/build.gradle 
            sed -i "/android:text=/s#=\"#=\"${{ env.tag }}\\\\n\\\\n#" app/src/main/res/layout/dialog_about.xml
          else
             sed -i "/versionName/s#[0-9a-zA-Z_\.\'\"-]\+\$#\'${{ env.tag }}\'#" app/build.gradle
             sed -i "/android:text=/s#=\"#=\"${{ env.tag }}\\\\n\\\\n#" app/src/main/res/layout/dialog_about.xml
          fi 
          
          echo 'crosswalk源，防挂'
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/crosswalk/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          else
            sed -i "/jitpack.io/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi

          echo '【魔改】全方位注入自定义默认节目源'
          # 1. 替换传统 strings.xml 中的各种可能配置名（app_init_config, default_config 等）
          find . -name "*strings.xml" | xargs sed -i 's#<string name="app_init_config">.*</string>#<string name="app_init_config">https://tvbox.sjk.kdns.fr/</string>#g'
          find . -name "*strings.xml" | xargs sed -i 's#<string name="default_config">.*</string>#<string name="default_config">https://tvbox.sjk.kdns.fr/</string>#g'

          # 2. 强力攻坚：直接在 Java/Kotlin 源代码中搜索常见的默认空源或测试源赋值，将其强行替换
          # 很多 TVBox 分支会在代码里写 private String ... = "" 或 "clan://localhost/..."
          # 我们全局搜索可能存在初始化地址的源码文件并用 sed 覆盖
          find app/src/main/ -type f \( -name "*.java" -o -name "*.kt" \) | xargs sed -i 's#\"clan://localhost/tvbox/txt/index.txt\"#\"https://tvbox.sjk.kdns.fr/\"#g' 2>/dev/null || true
          find app/src/main/ -type f \( -name "*.java" -o -name "*.kt" \) | xargs sed -i 's#\"https://github.com/[^\"]*/raw/[^\"]*\"#\"https://tvbox.sjk.kdns.fr/\"#g' 2>/dev/null || true

          echo '【魔改】修改桌面图标显示名称为：白龙苑影视'
          find . -name "*strings.xml" | xargs sed -i 's#<string name="app_name">.*</string>#<string name="app_name">白龙苑影视</string>#g'

      - name: Compress Source Code
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          tar -cJf sourceCode-${{ env.commitS }}.tar.xz --exclude=.git --exclude=.github *

      - name: Release Apk Sign
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          SIGN_BLOCK="signingConfigs { myConfig { storeFile file(project.hasProperty('RELEASE_STORE_FILE') ? RELEASE_STORE_FILE : 'TVBoxOSC.jks'); storePassword(project.hasProperty('RELEASE_STORE_PASSWORD') ? RELEASE_STORE_PASSWORD : 'TVBoxOSC'); keyAlias(project.hasProperty('RELEASE_KEY_ALIAS') ? RELEASE_KEY_ALIAS : 'TVBoxOSC'); keyPassword(project.hasProperty('RELEASE_KEY_PASSWORD') ? RELEASE_KEY_PASSWORD : 'TVBoxOSC'); v1SigningEnabled true; v2SigningEnabled true; enableV3Signing = true; enableV4Signing = true; } };"
          sed -i "/android {/a \    $SIGN_BLOCK" app/build.gradle
          sed -i "/debug {/a \            signingConfig signingConfigs.myConfig" app/build.gradle
          sed -i "/release {/a \            signingConfig signingConfigs.myConfig" app/build.gradle
          
          if [ -n "${{ secrets.MY_JKS_FILE }}" ]; then
            echo "检测到专属密钥，正在注入..."
            echo "${{ secrets.MY_JKS_FILE }}" | base64 -d > app/TVBoxOSC.jks
            sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties
            sed -i '$a\RELEASE_KEY_ALIAS=${{ secrets.MY_ALIAS_NAME }}'            ./gradle.properties
            sed -i '$a\RELEASE_STORE_PASSWORD=${{ secrets.MY_SIGN_PASSWORD }}'       ./gradle.properties
            sed -i '$a\RELEASE_KEY_PASSWORD=${{ secrets.MY_ALIAS_PASSWORD }}'          ./gradle.properties
          else
            echo "未检测到专属密钥，使用临时自动生成的密钥..."
            keytool -genkeypair -v -keystore app/TVBoxOSC.jks -keyalg RSA -keysize 2048 -validity 10000 -alias TVBoxOSC -storepass TVBoxOSC -keypass TVBoxOSC -dname "CN=TVBox, OU=TVBox, O=TVBox, L=SH, S=SH, C=CN"
            sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties
            sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties
            sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       ./gradle.properties
            sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'          ./gradle.properties
          fi
          
          sed -i 's/^#\(org.gradle.jvmargs=.*\)/\1/'        ./gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        if: ${{ matrix.java_ver }}
        with:
          distribution: temurin
          java-version: ${{ matrix.java_ver }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        if: ${{ env.commit }}

      - name: Create local.properties and Fix Hardcoded Python
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          find . -name "build.gradle" -exec sed -i 's|D:/Programs/Python/Python38/python.exe|python|g' {} +
          if [ -f "app/proguard-rules.pro" ]; then
            echo "-dontwarn org.xmlpull.v1.**" >> app/proguard-rules.pro
          fi

      - name: Build With Gradle
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --daemon --warning-mode all

      - name: Prepare App
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          rm -rf apk/
          mkdir -p apk/
          for file in `find . -name "*release*.apk" -print`; do
            base=$(basename "$file")
            
            variant=$(echo "$base" | sed -e 's/-release//g' -e 's/release//g' -e 's/app-//g' -e 's/\.apk//g' -e 's/TVBox_//g' -e 's/_-//g')
            
            if [ -n "$variant" ] && [ "$variant" != "app" ]; then
              new_base="白龙苑影视_${variant}_${{ env.tag }}.apk"
            else
              new_base="白龙苑影视_${{ matrix.userName }}_${{ env.tag }}.apk"
            fi
            
            mv "$file" "apk/$new_base"
          done
          mv sourceCode-${{ env.commitS }}.* apk/

      - name: Release Note
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          touch ${{ github.workspace }}/README.md
          lastCommit=$(grep "${{ matrix.userName }}\/${{ matrix.repoName }}" ${{ github.workspace }}/README.md |grep -o '[a-z0-9]\{40\}' || echo "")
          export LESSCHARSET=utf-8
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:\n\`\`\`" > apk/${{ matrix.userName }}-Release.log
          if [ -z "${lastCommit}" ] || [ "${{ env.commit }}" == "${lastCommit}" ]; then
            git log --pretty=format:%B ${{ env.commitS }} -1 |sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- >> apk/${{ matrix.userName }}-Release.log
          else
            git log --pretty=format:%B ${{ env.commitS }}...${lastCommit:0:7} |sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- >> apk/${{ matrix.userName }}-Release.log
          fi
          echo -e '\n```' >> apk/${{ matrix.userName }}-Release.log

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commit }}
        with:
          name: 白龙苑影视-产物包
          path: TVBoxOSC/apk/*

      - name: Whether Or Not to Publish
        if: ${{ inputs.donotpublish && env.commit }}
        run: |
          echo "commit=" >> $GITHUB_ENV

  clean:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs and artifacts
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
