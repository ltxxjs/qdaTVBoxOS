name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Java 环境
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 赋予 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 创建 local.properties 并强制修正 Python 路径
      # 这一步会把路径指向 Linux 系统下的 Python3
      - name: Create local.properties and set python path
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "python.path=/usr/bin/python3" >> local.properties

      # 5. 安装 Python 环境
      - name: Setup Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip

      # 6. 执行编译 (使用 sed 命令在编译前动态替换代码中的硬编码路径)
      # 该命令会将 build.gradle 中可能出现的 D:/Programs/Python/Python38/python.exe 替换为 /usr/bin/python3
      - name: Build with Gradle
        run: |
          find . -name "build.gradle" -exec sed -i 's|D:/Programs/Python/Python38/python.exe|/usr/bin/python3|g' {} +
          ./gradlew assembleDebug
        env:
          CHAQUOPY_BUILD_PYTHON: /usr/bin/python3

      # 7. 上传制品
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
