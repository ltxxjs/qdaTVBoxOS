name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Java 环境
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 赋予 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 创建空的 local.properties 以绕过配置检查
      - name: Create local.properties
        run: touch local.properties

      # 5. 安装并配置 Python 环境 (适配 Chaquopy)
      - name: Setup Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip

      # 6. 执行编译 (注入环境变量强制 Chaquopy 使用 Linux 路径)
      - name: Build with Gradle
        run: ./gradlew assembleDebug
        env:
          CHAQUOPY_BUILD_PYTHON: /usr/bin/python3

      # 7. 上传制品
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
