name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Java 环境
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 赋予 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 创建 local.properties 并清理环境
      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "python.path=/usr/bin/python3" >> local.properties

      # 5. 深度配置 Python 环境 (修复 ModuleNotFoundError)
      # 确保安装 pip 并升级，修复 pip 内部依赖冲突
      - name: Setup Python Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-setuptools
          python3 -m pip install --upgrade pip setuptools wheel
          # 显式安装修复缺失模块所需的依赖
          python3 -m pip install six

      # 6. 执行编译
      # 依然替换硬编码路径，并传递正确的 python 命令
      - name: Build with Gradle
        run: |
          find . -name "build.gradle" -exec sed -i 's|D:/Programs/Python/Python38/python.exe|/usr/bin/python3|g' {} +
          ./gradlew assembleDebug
        env:
          CHAQUOPY_BUILD_PYTHON: /usr/bin/python3

      # 7. 上传制品
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
